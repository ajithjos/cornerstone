<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Number practice · Beacon</title>
    <link rel="stylesheet" href="foundation.css">
    <link rel="stylesheet" href="styles.css">
    <script src="bridge.js" defer></script>
    <script src="activity.js" defer></script>
  </head>
  <body>
    <main id="activity" aria-busy="true">
      <header>
        <div class="title-row"><h1 id="title">Number practice</h1><span id="mode" class="badge" hidden></span></div>
        <p id="instructions">Getting your questions ready…</p>
      </header>
      <div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true">Waiting for your lesson.</div>
      <div id="error" class="error" role="alert" hidden></div>
      <section aria-label="Answers">
        <div id="questions" class="questions"></div>
        <footer id="actions" hidden>
          <div><p id="result-title" class="result-title"></p><p id="result-detail" class="result-detail"></p></div>
          <button id="submit" type="button">Finish practice</button>
        </footer>
      </section>
      <noscript>Open this activity in Beacon with JavaScript enabled.</noscript>
    </main>
  </body>
</html>

map $http_x_forwarded_proto $forwarded_scheme {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;

  root /srv/cornerstone/frontend;
  index index.html;

  resolver 127.0.0.11 ipv6=off;
  set $control_plane_upstream http://control-plane:8788;

  location /api/ {
    proxy_pass $control_plane_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
  }

  location = /health {
    proxy_pass $control_plane_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}